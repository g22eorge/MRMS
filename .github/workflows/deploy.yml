# Build, publish and deploy — the same shape as eaglestays' CI/CD on the server
# MRMS shares with it: test, build images on GitHub's runners, push them to
# GHCR, then SSH in and have the server pull and restart. The server never
# builds. It has one vCPU and is already serving eaglestays; a `next build` on it
# would compete with that site for the length of every deploy.
#
# Deploys the Postgres migration branch, for now. It does not touch `main`,
# which keeps deploying wherever it already does until the cutover — see
# docs/cutover-runbook.md for the order, which matters. Add `main` to the
# trigger as part of the cutover, not before.
#
# ── What this does NOT do on the shared server ──────────────────────────────
# eaglestays' nginx publishes 80 and 443 itself (its Traefik edge proxy is on a
# branch, feat/traefik-edge, never merged). This stack therefore publishes only
# APP_PORT, over plain HTTP, and never runs `compose down` on anything but its
# own project. It must not be deployed to /var/www/eagle-info: eaglestays'
# deploy runs `compose down` on that path to free 80/443, every time.
#
# ── Required repo secrets (Settings → Secrets and variables → Actions) ───────
#   ENV_CI          the application .env, pasted as one secret (.env.ci.example)
#   SERVER_HOST     server IP           ┐ the same server as eaglestays, so the
#   SERVER_USER     SSH user            │ same values as its secrets. If this
#   SERVER_SSH_KEY  PEM private key     │ repository moves into the
#   SERVER_PORT     SSH port            ┘ eagleinfo-solutions org they can be
#                                         org-level secrets shared by both.
# Optional:
#   DEPLOY_PATH     defaults to /var/www/mrms
#
# One-time on the server, as the deploy user:
#   sudo mkdir -p /var/www/mrms && sudo chown "$USER" /var/www/mrms

name: Deploy

on:
  push:
    branches:
      - feat/postgres-docker-migration
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  # A deploy that has started SSHing should finish, not be cut off halfway
  # through `compose up` by the next push.
  cancel-in-progress: false

jobs:
  # ── 1. Quality gate ─────────────────────────────────────────────────────────
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_SECRET: "test-only-not-a-real-secret-for-ci-builds-only"
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      BETTER_AUTH_URL: http://127.0.0.1:3000
    services:
      # Exactly what `bun run test:unit` hard-codes — port 5434, mrms_scratch,
      # the dev password — so the script runs here unmodified. ci.yml's service
      # did not match it, which nobody saw because Actions has not run since May.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mrms
          POSTGRES_PASSWORD: mrms_dev_password
          POSTGRES_DB: mrms_scratch
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U mrms -d mrms_scratch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-deploy-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-deploy-
      - run: bun install --frozen-lockfile
      - run: bun run prisma:generate
      - run: bun run lint
      - run: bunx tsc --noEmit
      - run: bun run test:unit
      - run: bun run build

  # ── 2. Build and push one image per Dockerfile target ───────────────────────
  build:
    name: Build ${{ matrix.service }}
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { service: migrate,   target: migrator }
          - { service: app,       target: runner }
          - { service: worker,    target: worker }
          - { service: scheduler, target: scheduler }
          - { service: backup,    target: backup }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # GHCR rejects upper-case repository names; the owner can contain them.
      - id: names
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mrms" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          # Tagged by commit, and the deploy pulls by commit: what runs is
          # exactly what passed the gate above, never "whatever latest is now".
          tags: |
            ${{ steps.names.outputs.prefix }}-${{ matrix.service }}:${{ github.sha }}
            ${{ steps.names.outputs.prefix }}-${{ matrix.service }}:${{ github.ref_name == 'main' && 'latest' || 'staging' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ── 3. Deploy ───────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: mrms-staging
    steps:
      - uses: actions/checkout@v4

      - id: names
        env:
          DEPLOY_PATH_SECRET: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mrms" >> "$GITHUB_OUTPUT"
          path="${DEPLOY_PATH_SECRET:-/var/www/mrms}"
          # eaglestays' deploy runs `compose down` on this path to free 80/443.
          case "$path" in
            /var/www/eagle-info|/var/www/eagle-info/*)
              echo "::error::DEPLOY_PATH=$path is the directory eaglestays' deploy stops on every run. Use another."
              exit 1 ;;
          esac
          echo "path=$path" >> "$GITHUB_OUTPUT"

      # The application .env from ENV_CI, plus the two values compose needs to
      # pull this commit's images instead of building them.
      # Through an environment variable, not `echo "${{ secrets.ENV_CI }}"`.
      # The expression is substituted into the script text before the shell
      # reads it, so a token or password containing `$`, a backtick or a quote
      # would be expanded or truncated on the way into .env — silently.
      - name: Write .env
        env:
          ENV_CI: ${{ secrets.ENV_CI }}
          IMAGE_PREFIX: ${{ steps.names.outputs.prefix }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          {
            printf '%s\n' "$ENV_CI"
            printf 'IMAGE_PREFIX=%s\nIMAGE_TAG=%s\n' "$IMAGE_PREFIX" "$IMAGE_TAG"
          } > .env
          grep -qE '^POSTGRES_PASSWORD=[^[:space:]#]' .env \
            || { echo "::error::ENV_CI has no POSTGRES_PASSWORD value — see .env.ci.example"; exit 1; }

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "docker-compose.yml,.env,scripts/backup-db.sh,scripts/restore-db.sh"
          target: ${{ steps.names.outputs.path }}
          overwrite: true

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
          DEPLOY_PATH: ${{ steps.names.outputs.path }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: GH_TOKEN,GH_USER,DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            chmod 600 .env
            chmod +x scripts/*.sh
            # Same sudoers arrangement as eaglestays: the deploy user is not in
            # the docker group, so docker goes through `sudo -n` on a fixed path.
            DOCKER="sudo -n /usr/bin/docker"

            echo "$GH_TOKEN" | $DOCKER login ghcr.io -u "$GH_USER" --password-stdin

            # Only ever this project. No `down`, no other directory, nothing on
            # 80/443 — eaglestays is live on the same machine.
            $DOCKER compose pull
            # `migrate` is a one-shot that `app` waits on, so a failed migration
            # leaves the previous app container serving rather than starting a
            # new one against a schema it does not match.
            $DOCKER compose up -d --no-build --remove-orphans

            # Wait for the container healthcheck (/api/health, which checks the
            # database) rather than trusting that "started" means "working".
            for i in $(seq 1 60); do
              state="$($DOCKER inspect --format '{{.State.Health.Status}}' "$($DOCKER compose ps -q app)" 2>/dev/null || true)"
              [ "$state" = "healthy" ] && { echo "app healthy"; break; }
              [ "$i" = 60 ] && { echo "app not healthy after 5 minutes: $state"; $DOCKER compose logs --tail 80 migrate app; exit 1; }
              sleep 5
            done

            $DOCKER image prune -f

      - name: Verify
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ steps.names.outputs.path }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: DEPLOY_PATH
          script: |
            cd "$DEPLOY_PATH"
            DOCKER="sudo -n /usr/bin/docker"
            $DOCKER compose ps
            port="$(grep -E '^APP_PORT=' .env | cut -d= -f2 | sed 's/[[:space:]].*//')"
            curl -fsS "http://127.0.0.1:${port:-3000}/api/health" && echo
