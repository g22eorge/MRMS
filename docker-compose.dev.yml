# Local development database only — the app still runs on the host via
# `bun run dev`. The full application stack (app + worker + redis + scheduler)
# arrives in Phase 5's docker-compose.yml.
#
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down          # keeps data
#   docker compose -f docker-compose.dev.yml down -v       # wipes data
#
# Port 5433, not 5432: a host Postgres (Postgres.app) commonly holds 5432 and
# the collision is silent and confusing — you connect to the wrong server.

# Own project name: docker-compose.yml declares `name: mrms`, and without this
# the two files would share a project — `docker compose ps` on the application
# stack would list these development containers as part of it.
name: mrms-dev

services:
  postgres:
    image: postgres:18-alpine
    container_name: mrms-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: mrms
      POSTGRES_PASSWORD: mrms_dev_password
      POSTGRES_DB: mrms
      # Deterministic collation so ORDER BY matches production regardless of
      # the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18+ wants a single mount at /var/lib/postgresql, not at
      # .../data — the image places the cluster in a version-named subdirectory
      # so `pg_upgrade --link` does not cross a mount boundary. Mounting
      # .../data makes the 18 image refuse to start.
      - mrms-pgdata-dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrms -d mrms"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Scratch database for the import rehearsals in Phase 4, so a failed dry run
  # never leaves the working dev database half-populated.
  postgres-scratch:
    image: postgres:18-alpine
    container_name: mrms-postgres-scratch
    restart: unless-stopped
    environment:
      POSTGRES_USER: mrms
      POSTGRES_PASSWORD: mrms_dev_password
      POSTGRES_DB: mrms_scratch
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5434:5432"
    volumes:
      - mrms-pgdata-scratch:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrms -d mrms_scratch"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mrms-pgdata-dev:
  mrms-pgdata-scratch:
