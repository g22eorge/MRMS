# care.eagleinfosolutions.com -> MRMS, served by the eaglestays nginx container.
#
# This file is owned by the MRMS repo. The MRMS deploy copies it to
# /var/www/edge/nginx/mrms-care.conf on the server; eaglestays' nginx includes
# every *.conf in that directory (its prod.conf: `include /etc/nginx/shared.d/*.conf;`).
# The deploy runs `nginx -t` before reloading and removes this file again if
# the test fails, so a mistake here cannot sit on disk until eaglestays' next
# restart and take that site down with it.
#
# Paths inside the nginx container (mounted by eaglestays' docker-compose.prod.yml):
#   /etc/nginx/shared.d  <- /var/www/edge/nginx   this file
#   /edge/certs          <- /var/www/edge/certs   published by MRMS's certbot service
#   /edge/acme           <- /var/www/edge/acme    HTTP-01 challenge webroot
# The app itself is MRMS's `app` container, published on the host at APP_PORT
# (3010), reached through `host.docker.internal` (extra_hosts: host-gateway).

# The certificate path goes through a variable on purpose. A literal path is
# loaded when nginx starts, and if the file is missing nginx refuses to start
# at all -- which would take eaglestays.ug down until a certificate exists.
# With a variable it is read at handshake time instead: before certbot has
# issued, only care's handshakes fail and nginx itself starts normally. The map
# yields a constant, so the path does not depend on anything the client sends.
map $ssl_server_name $mrms_care_cert {
    default /edge/certs/care.eagleinfosolutions.com/fullchain.pem;
}
map $ssl_server_name $mrms_care_key {
    default /edge/certs/care.eagleinfosolutions.com/privkey.pem;
}
# WebSocket upgrade when asked for, a plain keep-alive request otherwise.
map $http_upgrade $mrms_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name care.eagleinfosolutions.com;

    # Let's Encrypt HTTP-01, and the reachability probe MRMS's certbot loop
    # uses to tell whether DNS points here yet (see scripts/edge/certbot-loop.sh).
    location ^~ /.well-known/acme-challenge/ {
        root /edge/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2  on;
    server_name care.eagleinfosolutions.com;

    ssl_certificate     $mrms_care_cert;
    ssl_certificate_key $mrms_care_key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:MRMS_SSL:5m;
    ssl_session_timeout 10m;

    # Job photos and document uploads. Larger than the app accepts, so the app's
    # own validation produces the error the user sees, not a bare nginx 413.
    client_max_body_size 25M;

    # No `preload` and no includeSubDomains: this hostname is one of several
    # services on eagleinfosolutions.com, and the rest are not ours to commit.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass         http://host.docker.internal:3010;
        proxy_http_version 1.1;
        # The app decides single-tenant (care) vs commercial from the Host
        # header; an unforwarded host would read as `host.docker.internal:3010`.
        # See docs/deployment.md, "The proxy must preserve the Host header".
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $mrms_connection;
        # PDF generation and reports can take a while on a 1 vCPU box.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
