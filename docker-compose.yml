# The full application stack, for a single VPS.
#
#   cp .env.docker.example .env      # then fill it in
#   docker compose up -d --build
#   docker compose logs -f app
#
# Everything runs in a container, database included. The database lives in the
# named volume `pgdata`; losing that volume loses the data, which is why the
# `backup` service is part of the default stack rather than an optional extra.

name: mrms

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}

# .env is the single source of environment for this stack: every application
# service loads it wholesale via `env_file`, so adding a variable there reaches
# the containers without touching this file.
#
# What stays here is only what .env must NOT decide:
#
#   DATABASE_URL  the containers reach Postgres at the hostname `postgres` on the
#                 compose network, never at localhost. Assembled from the
#                 POSTGRES_* values so there is one place to change the password.
#   UPLOADS_DIR   a path inside the container, backed by the `uploads` volume.
#   REDIS_URL     defaults to the bundled service; .env can override it.
#   NODE_ENV      always production in an image built for production.
#
# The four `:?` guards are deliberate: compose refuses to start a
# half-configured stack rather than booting an app with no session secret. They
# also mean these values are validated even though env_file would have supplied
# them anyway.
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  UPLOADS_DIR: /data/uploads
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL in .env}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-${NEXT_PUBLIC_APP_URL}}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (32+ random chars)}
  CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env (32+ random chars)}

# Loaded by every application service. Anything in .env that is not overridden
# above is passed through as-is.
x-env-file: &env-file
  - .env

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      <<: *postgres-env
      # Deterministic collation, so ORDER BY does not depend on the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      # Postgres 18 wants a single mount at /var/lib/postgresql, not at
      # .../data: the image places the cluster in a version-named subdirectory
      # so `pg_upgrade --link` does not cross a mount boundary. Mounting
      # .../data makes the image refuse to start.
      - pgdata:/var/lib/postgresql
    # Not published to the host. Nothing outside this network needs it, and an
    # exposed Postgres port on a VPS is scanned within hours.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  # One-shot: applies migrations, then exits. `app` waits for it to succeed, so a
  # failed migration keeps the old container serving instead of starting a new
  # one against a schema it does not match.
  migrate:
    build:
      context: .
      target: migrator
    env_file: *env-file
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: ["bunx", "prisma", "migrate", "deploy"]
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 384M
        reservations:
          cpus: "0.05"
          memory: 64M

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: *env-file
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/data/uploads
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Append-only so a restart does not lose queued jobs.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: *env-file
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/data/uploads
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  # Replaces Vercel Cron. Without this the WhatsApp retry queue stops draining,
  # subscriptions stop advancing, data healing stops and audit logs grow without
  # bound — all silently.
  scheduler:
    build:
      context: .
      target: scheduler
    restart: unless-stopped
    # Deliberately no env_file: this service only ticks a clock and makes an
    # authenticated HTTP call, so it has no reason to hold the database
    # credentials or any provider API key.
    environment:
      # Internal address; the scheduler never leaves the compose network.
      APP_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env (32+ random chars)}
    depends_on:
      app:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

  backup:
    build:
      context: .
      target: backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backups:/backups
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 192M
        reservations:
          cpus: "0.05"
          memory: 32M

volumes:
  pgdata:
  uploads:
  redisdata:
  # Dumps live here. Copy them off the host as well — a backup on the same
  # machine does not survive losing the machine.
  backups:
