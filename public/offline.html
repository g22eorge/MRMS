<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>No connection</title>
<style>
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;background:#0a0a0a;color:#e5e5e5;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px}
h1{font-size:20px;margin:0 0 8px}
p{font-size:14px;color:#9a9a9a;margin:0 0 20px;max-width:26rem}
button{background:#C9A227;color:#000;border:0;border-radius:10px;padding:12px 22px;font-size:14px;font-weight:700}
</style>
</head>
<body>
<div>
<h1>No connection</h1>
<p>Everything you saved is safe. This page comes back by itself when the connection does.</p>
<button onclick="location.reload()">Try now</button>
</div>
<script>
addEventListener("online", function () { location.reload(); });
setInterval(function () { if (navigator.onLine) location.reload(); }, 8000);
</script>
</body>
</html>
